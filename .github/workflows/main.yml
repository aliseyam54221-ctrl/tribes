name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create . --platforms=android --project-name tribes_game
      - run: flutter pub add image_picker google_fonts
      - run: cp main.dart lib/main.dart
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: tribes-apk
          path: build/app/outputs/flutter-apk/app-release.apk
